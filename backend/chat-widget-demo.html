<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RCField Chat Widget Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
    }

    /* ── Demo page backdrop ───────────────────────────────────────── */
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
      padding: 24px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: #1e293b;
    }

    .config-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      background: #fff;
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      flex-wrap: wrap;
    }

    .config-bar label { font-size: 13px; color: #64748b; white-space: nowrap; }

    .config-bar input {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      width: 320px;
      outline: none;
    }

    .config-bar input:focus { border-color: var(--primary); }

    .btn-load {
      background: var(--primary, #2563eb);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-load:hover { opacity: .9; }

    .hint { font-size: 12px; color: #94a3b8; }

    /* ── Widget container ─────────────────────────────────────────── */
    #widget-root {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      z-index: 9999;
    }

    /* ── Chat window ──────────────────────────────────────────────── */
    .chat-window {
      width: 360px;
      height: 540px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: opacity .2s, transform .2s;
    }

    .chat-window.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px) scale(.97);
    }

    /* header */
    .chat-header {
      background: var(--primary, #2563eb);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .chat-header-info { flex: 1; }
    .chat-header-name { font-weight: 700; font-size: 15px; }
    .chat-header-status { font-size: 12px; opacity: .8; display: flex; align-items: center; gap: 4px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; display: inline-block; }

    .btn-close {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 20px;
      opacity: .8;
      line-height: 1;
      padding: 2px;
    }
    .btn-close:hover { opacity: 1; }

    /* messages */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      gap: 8px;
      max-width: 85%;
    }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--primary, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg-bubble {
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .msg-bubble {
      background: var(--primary, #2563eb);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.bot .msg-bubble {
      background: #f1f5f9;
      color: #1e293b;
      border-bottom-left-radius: 4px;
    }

    /* slot list */
    .slot-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .slot-chip {
      background: #eff6ff;
      border: 1px solid var(--primary, #2563eb);
      color: var(--primary, #2563eb);
      border-radius: 20px;
      padding: 3px 11px;
      font-size: 12px;
      font-weight: 600;
    }

    /* typing indicator */
    .typing .msg-bubble {
      background: #f1f5f9;
      padding: 12px 16px;
      white-space: normal;
      align-self: flex-start;
    }

    .typing-dots { display: flex; gap: 4px; align-items: center; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #94a3b8;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* quick replies */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 12px 8px;
    }

    .qr-btn {
      border: 1.5px solid var(--primary, #2563eb);
      color: var(--primary, #2563eb);
      background: #fff;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }

    .qr-btn:hover {
      background: var(--primary, #2563eb);
      color: #fff;
    }

    /* input area */
    .chat-input-area {
      border-top: 1px solid #e2e8f0;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .chat-input {
      flex: 1;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 14px;
      resize: none;
      outline: none;
      max-height: 96px;
      line-height: 1.4;
      font-family: inherit;
    }

    .chat-input:focus { border-color: var(--primary, #2563eb); }

    .btn-send {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--primary, #2563eb);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity .15s;
    }

    .btn-send:hover { opacity: .85; }
    .btn-send:disabled { opacity: .4; cursor: not-allowed; }

    .btn-send svg { width: 18px; height: 18px; fill: #fff; }

    /* ── FAB ──────────────────────────────────────────────────────── */
    .fab {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary, #2563eb);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      transition: transform .2s;
      color: #fff;
      font-size: 26px;
      flex-shrink: 0;
    }

    .fab:hover { transform: scale(1.08); }

    .fab-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: #ef4444;
      color: #fff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      display: none;
    }

    .fab-wrap { position: relative; }
  </style>
</head>
<body>

<!-- Demo backdrop -->
<div class="page">
  <div class="page-title">🏎️ RCField Chat Widget Demo</div>

  <div class="config-bar">
    <label>Cafe ID</label>
    <input id="cafe-id-input" type="text" placeholder="paste cafeId từ seed output..." />
    <button class="btn-load" onclick="loadWidget()">Load Widget</button>
  </div>

  <p class="hint">
    API: <code>http://localhost:3000</code> &nbsp;|&nbsp;
    Lấy cafeId từ output của <code>npm run seed:cafes</code>
  </p>
</div>

<!-- Widget (injected into DOM) -->
<div id="widget-root"></div>

<script>
  // ── State ────────────────────────────────────────────────────────
  let cafeId = '';
  let isOpen = false;
  let isLoading = false;
  let conversationHistory = [];
  let widgetConfig = {
    greeting_message: 'Xin chào! Tôi có thể giúp gì cho bạn?',
    primary_color: '#2563EB',
    quick_replies: ['Giờ mở cửa', 'Còn slot không?', 'Giá thuê xe'],
    cafe_name: 'RC Cafe',
  };

  // ── Init ─────────────────────────────────────────────────────────
  window.onload = () => {
    const saved = localStorage.getItem('rcfield_demo_cafe_id');
    if (saved) document.getElementById('cafe-id-input').value = saved;
  };

  async function loadWidget() {
    const input = document.getElementById('cafe-id-input').value.trim();
    if (!input) { alert('Nhập cafeId trước.'); return; }
    cafeId = input;
    localStorage.setItem('rcfield_demo_cafe_id', cafeId);

    // Fetch widget config
    try {
      const res = await fetch(`http://localhost:3000/api/v1/cafes/${cafeId}/chat/config`);
      if (res.ok) {
        const data = await res.json();
        widgetConfig = { ...widgetConfig, ...data };
      }
    } catch (e) {
      console.warn('Could not load widget config, using defaults');
    }

    // Also fetch cafe name
    try {
      const res = await fetch(`http://localhost:3000/api/v1/cafes/${cafeId}`);
      if (res.ok) {
        const data = await res.json();
        widgetConfig.cafe_name = data.name ?? widgetConfig.cafe_name;
      }
    } catch (_) {}

    document.documentElement.style.setProperty('--primary', widgetConfig.primary_color || '#2563EB');
    conversationHistory = [];
    renderWidget();
  }

  // ── Render ───────────────────────────────────────────────────────
  function renderWidget() {
    const root = document.getElementById('widget-root');
    root.innerHTML = `
      <div class="chat-window ${isOpen ? '' : 'hidden'}" id="chat-window">
        <div class="chat-header">
          <div class="chat-avatar">🏎️</div>
          <div class="chat-header-info">
            <div class="chat-header-name">${escHtml(widgetConfig.cafe_name)}</div>
            <div class="chat-header-status"><span class="dot"></span> Trợ lý AI</div>
          </div>
          <button class="btn-close" onclick="toggleWidget()">✕</button>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="quick-replies" id="quick-replies"></div>

        <div class="chat-input-area">
          <textarea
            class="chat-input"
            id="chat-input"
            rows="1"
            placeholder="Nhập tin nhắn..."
            onkeydown="handleKey(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button class="btn-send" id="btn-send" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>

      <div class="fab-wrap">
        <button class="fab" onclick="toggleWidget()">
          ${isOpen ? '✕' : '💬'}
        </button>
        <div class="fab-badge" id="fab-badge">1</div>
      </div>
    `;

    renderMessages();
    renderQuickReplies(widgetConfig.quick_replies || []);
  }

  function toggleWidget() {
    if (!cafeId) { alert('Nhập cafeId và bấm Load Widget trước.'); return; }
    isOpen = !isOpen;
    renderWidget();
    if (isOpen && conversationHistory.length === 0) {
      appendBotMessage(widgetConfig.greeting_message, 'greeting', [], []);
    }
    if (isOpen) setTimeout(() => document.getElementById('chat-input')?.focus(), 100);
  }

  // ── Messages ─────────────────────────────────────────────────────
  function renderMessages() {
    const el = document.getElementById('chat-messages');
    if (!el) return;
    const wasTyping = !!document.getElementById('typing-indicator');
    el.innerHTML = conversationHistory.map(renderMsg).join('');
    if (wasTyping) showTyping();
    el.scrollTop = el.scrollHeight;
  }

  function renderMsg(msg) {
    if (msg.role === 'user') {
      return `
        <div class="msg user">
          <div class="msg-bubble">${escHtml(msg.content)}</div>
        </div>`;
    }

    let extra = '';
    if (msg.slots && msg.slots.length > 0) {
      const chips = msg.slots.map(s =>
        `<span class="slot-chip">${s.time} (${s.availableCount} chỗ)</span>`
      ).join('');
      extra = `<div class="slot-list">${chips}</div>`;
    }

    return `
      <div class="msg bot">
        <div class="msg-avatar">🤖</div>
        <div>
          <div class="msg-bubble">${escHtml(msg.content)}${extra}</div>
        </div>
      </div>`;
  }

  function appendBotMessage(text, type, quickReplies, slots) {
    conversationHistory.push({ role: 'model', content: text, slots: slots || [] });
    renderMessages();
    renderQuickReplies(quickReplies || []);
  }

  function showTyping() {
    const el = document.getElementById('chat-messages');
    if (!el) return;
    const div = document.createElement('div');
    div.className = 'msg bot typing';
    div.id = 'typing-indicator';
    div.innerHTML = `<div class="msg-avatar">🤖</div><div><div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>`;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
  }

  function hideTyping() {
    document.getElementById('typing-indicator')?.remove();
  }

  function renderQuickReplies(replies) {
    const el = document.getElementById('quick-replies');
    if (!el) return;
    el.innerHTML = replies.map(r =>
      `<button class="qr-btn" onclick="sendQuickReply('${escAttr(r)}')">${escHtml(r)}</button>`
    ).join('');
  }

  // ── Send ─────────────────────────────────────────────────────────
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 96) + 'px';
  }

  function sendQuickReply(text) {
    document.getElementById('chat-input').value = text;
    sendMessage();
  }

  async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    renderQuickReplies([]);

    conversationHistory.push({ role: 'user', content: text });
    renderMessages();

    isLoading = true;
    document.getElementById('btn-send').disabled = true;
    showTyping();

    // Build history for API (exclude current message)
    const history = conversationHistory
      .slice(0, -1)
      .filter(m => m.role === 'user' || m.role === 'model')
      .map(m => ({ role: m.role, content: m.content }));

    try {
      const res = await fetch(`http://localhost:3000/api/v1/cafes/${cafeId}/chat/stream`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, conversationHistory: history }),
      });

      if (!res.ok) {
        hideTyping();
        const err = await res.json().catch(() => ({}));
        appendBotMessage(`Lỗi: ${err.message || res.statusText}`, 'text', [], []);
        return;
      }

      // Non-streaming response (slot_check / fast_answer)
      const contentType = res.headers.get('content-type') || '';
      if (contentType.includes('application/json')) {
        hideTyping();
        const data = await res.json();
        const slots = data.data?.slots || [];
        appendBotMessage(data.answer, data.response_type, data.quick_replies || [], slots);
        return;
      }

      // SSE streaming — giữ typing indicator cho đến khi done event (full answer sẵn sàng)
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (line.startsWith('data:')) {
            try {
              const payload = JSON.parse(line.slice(5).trim());

              if (payload.full_answer !== undefined) {
                // Done event — ẩn typing, hiển thị full answer cùng lúc
                hideTyping();
                appendBotMessage(payload.full_answer, 'text', payload.quick_replies || [], []);
              }
              // payload.text (chunk) — bỏ qua, giữ typing indicator
            } catch (_) {}
          }
        }
      }

    } catch (e) {
      hideTyping();
      appendBotMessage('Không kết nối được server. Kiểm tra lại npm run dev.', 'text', [], []);
    } finally {
      isLoading = false;
      document.getElementById('btn-send').disabled = false;
      document.getElementById('chat-input')?.focus();
    }
  }

  // ── Utils ─────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escAttr(s) {
    return String(s).replace(/'/g, "\\'");
  }
</script>
</body>
</html>
